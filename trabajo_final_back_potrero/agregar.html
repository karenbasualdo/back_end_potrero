<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar comida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Agregar comida</h1>

    <form method="POST" action="agregar.php">
        <label>Nombre de la comida</label>
        <input type="text" name="nombre" class="form-control mb-3" required>

        <label>Categoría</label>
        <input type="text" name="categoria" class="form-control mb-3" required>

        <label>Área / país</label>
        <input type="text" name="area" class="form-control mb-3" required>

        <label>Precio</label>
        <input type="number" step="0.01" name="precio" class="form-control mb-3" required>

        <label>URL de imagen</label>
        <input type="text" name="imagen" class="form-control mb-3" required>

        <label>Descripción</label>
        <textarea name="descripcion" class="form-control mb-3"></textarea>

        <input type="submit" name="submit" value="Ingresar" class="btn btn-success">
        <a href="listar.php" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
