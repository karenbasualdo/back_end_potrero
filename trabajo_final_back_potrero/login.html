<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sabores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="container py-5">
    <div class="login-box">
        <h1>Sabores</h1>
        <h2>Login</h2>

        <form action="login.php" method="post">
            <label for="usuario">Ingrese su usuario</label>
            <input type="text" id="usuario" name="usuario" class="form-control mb-3" required>

            <label for="contrasenia">Ingrese contraseña</label>
            <input type="password" id="contrasenia" name="contrasenia" class="form-control mb-3" required>

            <input type="submit" value="Aceptar" class="btn btn-warning w-100">
        </form>

        <p class="mt-3">Usuario: <strong>admin</strong> | Contraseña: <strong>1234</strong></p>
    </div>
</div>
</body>
</html>
